[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 1

[rpc_endpoints]
gnosis = "https://rpc.gnosis.gateway.fm"
chiado = "https://rpc.chiado.gnosis.gateway.fm"

[etherscan]
gnosis = { key = "${GNOSISSCAN_API_KEY}", url = "https://api.gnosisscan.io/api" }
chiado = { key = "${GNOSISSCAN_API_KEY}", url = "https://api.chiado.gnosisscan.io/api" }
